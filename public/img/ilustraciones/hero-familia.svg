<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 528" role="img" aria-labelledby="t"><title id="t">Familia en su sala conectada a electricidad, internet, seguridad y otros servicios</title>
<defs>
<linearGradient id="wall" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#1b37c0"/><stop offset="1" stop-color="#3550d6"/></linearGradient>
<linearGradient id="floor" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#0a1f87"/><stop offset="1" stop-color="#07113d"/></linearGradient>
<linearGradient id="night" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#07113d"/><stop offset=".7" stop-color="#0c1c66"/><stop offset="1" stop-color="#f86000"/></linearGradient>
<linearGradient id="sofa" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#ffffff"/><stop offset="1" stop-color="#dfe5ff"/></linearGradient>
<linearGradient id="sofaDark" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#c2ccfb"/><stop offset="1" stop-color="#94a5f5"/></linearGradient>
<radialGradient id="lamp" cx=".5" cy=".5" r=".5"><stop offset="0" stop-color="#ffd27a" stop-opacity=".85"/><stop offset=".5" stop-color="#ff8a3d" stop-opacity=".25"/><stop offset="1" stop-color="#ff8a3d" stop-opacity="0"/></radialGradient>
<radialGradient id="screen" cx=".5" cy=".5" r=".5"><stop offset="0" stop-color="#7dd3fc" stop-opacity=".6"/><stop offset="1" stop-color="#7dd3fc" stop-opacity="0"/></radialGradient>
<linearGradient id="card" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#fff" stop-opacity=".34"/><stop offset="1" stop-color="#fff" stop-opacity=".12"/></linearGradient>
<linearGradient id="beam" x1="1" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#ffd27a" stop-opacity=".35"/><stop offset="1" stop-color="#ffd27a" stop-opacity="0"/></linearGradient>
<linearGradient id="denim" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#5f8ff0"/><stop offset="1" stop-color="#3d6fd8"/></linearGradient>
<linearGradient id="orangeTop" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#ff8a3d"/><stop offset="1" stop-color="#f86000"/></linearGradient>
<linearGradient id="greenTop" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#34d399"/><stop offset="1" stop-color="#16a34a"/></linearGradient>
<pattern id="stars" width="40" height="40" patternUnits="userSpaceOnUse"><circle cx="6" cy="8" r="1" fill="#fff" opacity=".8"/><circle cx="28" cy="26" r=".8" fill="#fff" opacity=".6"/></pattern>
<filter id="sh" x="-30%" y="-30%" width="160%" height="160%"><feDropShadow dx="0" dy="10" stdDeviation="10" flood-color="#050b2b" flood-opacity=".4"/></filter>
<filter id="soft" x="-30%" y="-30%" width="160%" height="160%"><feDropShadow dx="0" dy="6" stdDeviation="6" flood-color="#050b2b" flood-opacity=".3"/></filter>
<filter id="neon" x="-50%" y="-50%" width="200%" height="200%"><feGaussianBlur stdDeviation="4" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
</defs>
