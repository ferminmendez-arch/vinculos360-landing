<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 528" role="img" aria-labelledby="t"><title id="t">Hogar moderno conectado: electricidad, internet, seguridad y más</title>
<defs>
<linearGradient id="sky" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#0c1c66"/><stop offset=".55" stop-color="#1b37c0"/><stop offset="1" stop-color="#5f75ea"/></linearGradient>
<radialGradient id="sun" cx=".5" cy=".5" r=".5"><stop offset="0" stop-color="#ffd27a"/><stop offset=".5" stop-color="#ff8a3d"/><stop offset="1" stop-color="#f86000" stop-opacity="0"/></radialGradient>
<linearGradient id="wall" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#ffffff"/><stop offset="1" stop-color="#e2e8f0"/></linearGradient>
<linearGradient id="wallSide" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#cbd5e1"/><stop offset="1" stop-color="#94a3b8"/></linearGradient>
<linearGradient id="win" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#fff3c4"/><stop offset="1" stop-color="#ffb347"/></linearGradient>
<linearGradient id="wood" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#c2410c"/><stop offset="1" stop-color="#f86000"/></linearGradient>
<linearGradient id="ground" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#0a1f87"/><stop offset="1" stop-color="#07113d"/></linearGradient>
<linearGradient id="card" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#fff" stop-opacity=".34"/><stop offset="1" stop-color="#fff" stop-opacity=".12"/></linearGradient>
<linearGradient id="beam" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#ffd27a" stop-opacity=".55"/><stop offset="1" stop-color="#ffd27a" stop-opacity="0"/></linearGradient>
<radialGradient id="winGlow" cx=".5" cy=".5" r=".5"><stop offset="0" stop-color="#ffd27a" stop-opacity=".55"/><stop offset="1" stop-color="#ffd27a" stop-opacity="0"/></radialGradient>
<pattern id="stars" width="60" height="60" patternUnits="userSpaceOnUse"><circle cx="8" cy="10" r="1.2" fill="#fff" opacity=".7"/><circle cx="40" cy="34" r="1" fill="#fff" opacity=".5"/><circle cx="22" cy="50" r=".8" fill="#fff" opacity=".6"/></pattern>
<filter id="sh" x="-30%" y="-30%" width="160%" height="160%"><feDropShadow dx="0" dy="12" stdDeviation="12" flood-color="#050b2b" flood-opacity=".45"/></filter>
<filter id="neon" x="-50%" y="-50%" width="200%" height="200%"><feGaussianBlur stdDeviation="4" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
</defs>
<rect width="600" height="528" fill="url(#sky)"/>
<rect width="600" height="300" fill="url(#stars)"/>
<circle cx="440" cy="300" r="170" fill="url(#sun)" opacity=".85"/>
<!-- colinas -->
<path d="M0 360 C120 320 220 340 320 330 C420 320 500 300 600 320 V528 H0Z" fill="#3550d6" opacity=".55"/>
<path d="M0 410 C140 380 300 400 600 380 V528 H0Z" fill="url(#ground)"/>
<!-- poste y cables -->
<rect x="62" y="230" width="8" height="190" rx="3" fill="#94a5f5"/><rect x="44" y="244" width="44" height="6" rx="3" fill="#94a5f5"/>
<path d="M88 250 C150 270 190 268 232 262" stroke="#94a5f5" stroke-width="2.5" fill="none"/>
<!-- casa moderna -->
<g filter="url(#sh)">
<!-- volumen derecho -->
<rect x="330" y="250" width="150" height="170" fill="url(#wall)"/>
<rect x="480" y="250" width="22" height="170" fill="url(#wallSide)"/>
<rect x="322" y="238" width="188" height="16" rx="4" fill="#0a1f87"/>
<!-- volumen izquierdo con techo inclinado -->
<path d="M150 300 L240 214 L340 300 V420 H150Z" fill="url(#wall)"/>
<path d="M132 304 L240 202 L352 304" stroke="#0b24a8" stroke-width="16" stroke-linejoin="round" stroke-linecap="round" fill="none"/>
<!-- ventanales iluminados -->
<circle cx="245" cy="330" r="90" fill="url(#winGlow)"/>
<rect x="176" y="318" width="70" height="62" rx="6" fill="url(#win)"/><path d="M211 318v62" stroke="#fff" stroke-width="4" opacity=".7"/>
<rect x="262" y="318" width="52" height="102" rx="6" fill="url(#wood)"/><circle cx="302" cy="372" r="4" fill="#ffd27a"/>
<rect x="350" y="276" width="112" height="70" rx="6" fill="url(#win)"/><path d="M406 276v70M350 311h112" stroke="#fff" stroke-width="4" opacity=".7"/>
<rect x="350" y="362" width="112" height="58" rx="6" fill="#1b37c0"/><path d="M372 362v58M394 362v58M416 362v58M438 362v58" stroke="#5f75ea" stroke-width="2"/>
<!-- detalles -->
<rect x="210" y="246" width="38" height="38" rx="19" fill="url(#win)"/>
<rect x="140" y="420" width="380" height="10" rx="3" fill="#cbd5e1"/>
</g>
<!-- cámara en la esquina -->
<path d="M486 268 L380 430 L560 430Z" fill="url(#beam)"/>
<g filter="url(#sh)"><rect x="482" y="256" width="14" height="10" rx="3" fill="#e2e8f0"/>
<g transform="rotate(30 500 270)"><rect x="482" y="262" width="44" height="20" rx="8" fill="#fff"/><circle cx="486" cy="272" r="8" fill="#0b1240"/><circle cx="486" cy="272" r="4" fill="#7dd3fc"/><circle cx="516" cy="268" r="2.5" fill="#ef4444" filter="url(#neon)"/></g></g>
<!-- plantas -->
<g><ellipse cx="120" cy="424" rx="26" ry="8" fill="#050b2b" opacity=".5"/><path d="M120 420c-20-10-26-34-14-52 10 14 16 30 14 52zM122 420c4-24 18-40 36-44-4 22-16 36-36 44z" fill="#15803d"/><path d="M118 420c-6-18 0-36 12-46 4 18 0 34-12 46z" fill="#22c55e"/></g>
<g><path d="M548 426c-14-8-18-24-10-36 8 10 12 22 10 36zM550 426c4-16 14-26 26-28-4 14-12 24-26 28z" fill="#22c55e"/></g>
<!-- tarjetas flotantes -->
<g filter="url(#sh)">
<rect x="40" y="88" width="92" height="92" rx="24" fill="url(#card)" stroke="#fff" stroke-opacity=".5"/>
<circle cx="86" cy="134" r="28" fill="#f86000"/><path d="M90 116l-16 24h12l-6 18 18 -26h-12l6 -16z" fill="#fff"/>
</g>
<g filter="url(#sh)">
<rect x="160" y="40" width="92" height="92" rx="24" fill="url(#card)" stroke="#fff" stroke-opacity=".5"/>
<circle cx="206" cy="86" r="28" fill="#fff"/>
<path d="M190 84a22 22 0 0 1 32 0M196 92a12 12 0 0 1 20 0" stroke="#0b24a8" stroke-width="5" fill="none" stroke-linecap="round"/><circle cx="206" cy="99" r="3.5" fill="#0b24a8"/>
</g>
<g filter="url(#sh)">
<rect x="470" y="70" width="92" height="92" rx="24" fill="url(#card)" stroke="#fff" stroke-opacity=".5"/>
<circle cx="516" cy="116" r="28" fill="#15803d"/>
<path d="M516 100l16 6v10c0 10-7 17-16 21c-9-4-16-11-16-21v-10z" fill="#fff"/><path d="M509 117l5 5 9-10" stroke="#15803d" stroke-width="3.5" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
</g>
<g filter="url(#sh)">
<rect x="368" y="130" width="72" height="72" rx="20" fill="url(#card)" stroke="#fff" stroke-opacity=".5"/>
<circle cx="404" cy="166" r="22" fill="#25d366"/><path d="M404 156v20M394 166h20" stroke="#fff" stroke-width="5" stroke-linecap="round"/>
</g>
<!-- líneas de conexión -->
<g stroke="#fff" stroke-opacity=".35" stroke-width="2" stroke-dasharray="4 6" fill="none">
<path d="M132 150 C180 190 200 220 220 250"/><path d="M220 132 C230 170 236 190 240 210"/><path d="M470 130 C440 170 430 200 420 240"/><path d="M404 202 C404 220 404 230 404 250"/>
</g>
<g fill="#fff"><path d="M300 70l4 10 10 4-10 4-4 10-4-10-10-4 10-4z" opacity=".9"/><path d="M560 210l3 7 7 3-7 3-3 7-3-7-7-3 7-3z" opacity=".8"/></g>
</svg>
