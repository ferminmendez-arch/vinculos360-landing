<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 300" role="img" aria-labelledby="t"><title id="t">Cámaras de seguridad y monitoreo del hogar</title>
<defs>
<linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#e6e9f7"/><stop offset="1" stop-color="#c2ccfb"/></linearGradient>
<linearGradient id="cone" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#ff8a3d" stop-opacity=".45"/><stop offset="1" stop-color="#ff8a3d" stop-opacity="0"/></linearGradient>
<linearGradient id="ph" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#0c1c66"/><stop offset="1" stop-color="#07113d"/></linearGradient>
</defs>
<rect width="480" height="300" rx="28" fill="url(#bg)"/>
<circle cx="70" cy="250" r="90" fill="#fff" opacity=".35"/>
