<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 300" role="img" aria-labelledby="t"><title id="t">Cámaras de seguridad y monitoreo</title>
<defs>
<linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#1b2a7a"/><stop offset=".6" stop-color="#0c1c66"/><stop offset="1" stop-color="#050b2b"/></linearGradient>
<linearGradient id="beam" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#ff8a3d" stop-opacity=".6"/><stop offset="1" stop-color="#ff8a3d" stop-opacity="0"/></linearGradient>
<linearGradient id="cam" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#ffffff"/><stop offset=".6" stop-color="#e2e8f0"/><stop offset="1" stop-color="#94a3b8"/></linearGradient>
<radialGradient id="lens" cx=".35" cy=".35" r=".7"><stop offset="0" stop-color="#7dd3fc"/><stop offset=".35" stop-color="#1b37c0"/><stop offset="1" stop-color="#050b2b"/></radialGradient>
<linearGradient id="card" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#fff" stop-opacity=".22"/><stop offset="1" stop-color="#fff" stop-opacity=".07"/></linearGradient>
<linearGradient id="shield" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#34d399"/><stop offset="1" stop-color="#15803d"/></linearGradient>
<pattern id="dots" width="16" height="16" patternUnits="userSpaceOnUse"><circle cx="2" cy="2" r="1.3" fill="#94a5f5" opacity=".25"/></pattern>
<filter id="sh" x="-30%" y="-30%" width="160%" height="160%"><feDropShadow dx="0" dy="10" stdDeviation="10" flood-color="#000" flood-opacity=".5"/></filter>
<filter id="neon" x="-50%" y="-50%" width="200%" height="200%"><feGaussianBlur stdDeviation="5" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
</defs>
<rect width="480" height="300" fill="url(#bg)"/>
<rect width="480" height="300" fill="url(#dots)"/>
<circle cx="120" cy="70" r="110" fill="#3550d6" opacity=".25"/>
<!-- haz de visión -->
<path d="M176 108L40 300H330Z" fill="url(#beam)"/>
<!-- cámara 3D -->
<g filter="url(#sh)">
<rect x="210" y="34" width="22" height="58" rx="6" fill="#cbd5e1"/>
<rect x="196" y="26" width="50" height="16" rx="6" fill="#e2e8f0"/>
<g transform="rotate(-22 200 104)">
<rect x="128" y="76" width="150" height="58" rx="22" fill="url(#cam)"/>
<rect x="128" y="76" width="150" height="16" rx="8" fill="#fff" opacity=".8"/>
<rect x="262" y="84" width="26" height="42" rx="10" fill="#cbd5e1"/>
<circle cx="146" cy="105" r="30" fill="#0b1240"/>
<circle cx="146" cy="105" r="21" fill="url(#lens)"/>
<circle cx="139" cy="97" r="6" fill="#fff" opacity=".85"/>
<circle cx="250" cy="96" r="5" fill="#ef4444" filter="url(#neon)"/>
</g>
</g>
<!-- teléfono con vista en vivo -->
<g filter="url(#sh)">
<rect x="344" y="56" width="110" height="200" rx="22" fill="#0a1033" stroke="#5f75ea" stroke-opacity=".6" stroke-width="2"/>
<rect x="354" y="72" width="90" height="168" rx="12" fill="url(#card)"/>
<rect x="362" y="82" width="74" height="70" rx="8" fill="#1b37c0"/>
<path d="M376 136l23-18 23 18v14h-46z" fill="#fff"/><rect x="393" y="134" width="12" height="16" rx="2" fill="#ff8a3d"/>
<circle cx="370" cy="90" r="4" fill="#ef4444" filter="url(#neon)"/><rect x="378" y="87" width="18" height="6" rx="3" fill="#fff" opacity=".85"/>
<rect x="362" y="162" width="74" height="10" rx="5" fill="#fff" opacity=".55"/><rect x="362" y="178" width="52" height="10" rx="5" fill="#fff" opacity=".35"/>
<rect x="362" y="198" width="34" height="28" rx="8" fill="#15803d"/><rect x="402" y="198" width="34" height="28" rx="8" fill="#fff" opacity=".2"/>
</g>
<!-- escudo -->
<g filter="url(#sh)" transform="translate(286 172)">
<path d="M36 0l34 13v26c0 24 -16 40 -34 49c-18 -9 -34 -25 -34 -49v-26z" fill="url(#shield)" stroke="#fff" stroke-width="4"/>
<path d="M22 44l10 10 18 -21" stroke="#fff" stroke-width="7" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
</g>
<g fill="#fff"><path d="M60 40l3 8 8 3-8 3-3 8-3-8-8-3 8-3z" opacity=".8"/><path d="M310 30l2.5 6 6 2.5-6 2.5-2.5 6-2.5-6-6-2.5 6-2.5z" opacity=".7"/></g>
</svg>
